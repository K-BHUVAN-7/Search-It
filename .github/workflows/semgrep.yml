# .github/workflows/semgrep.yml
name: Semgrep CI

on:
  pull_request: {} # Scans all pull requests

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest # Runs on a standard Linux virtual machine
    steps:
      # Step 1: Check out your repository's code
      - uses: actions/checkout@v4

      # Step 2: Run the Semgrep scan using the official Semgrep Action
      # This uses the community-driven "auto" configuration
      - uses: semgrep/semgrep-action@v2
